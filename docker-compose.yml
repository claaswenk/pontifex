# =============================================================================
# Pontifex – Docker Compose
# =============================================================================
# Usage:
#   cp .env.example .env          # fill in all secrets
#   docker compose up --build
#
# One service:
#   backend   – Flask serves both the REST API (/api/*) and the frontend SPA
#               from src/frontend/.  SQLite DB is embedded in the same container.
#
# Frontend build:
#   Place your compiled frontend assets in src/frontend/ before building the
#   container image (e.g. output of `npm run build`). Flask serves them as
#   static files; any unknown route falls back to index.html for SPA routing.
#
# Database:
#   SQLite runs inside the backend container. The database file is stored in
#   the named volume sqlite_data, mounted at /app/data/pontifex.db.
#   Set DB_PATH in your .env to override the default path.
#
# TLS (mandatory - the backend refuses to start without a certificate):
#   Put your certificate and key in ./certs/tls.crt and ./certs/tls.key.
#   ./certs is bind-mounted read-only to /run/secrets in the container.
#   The container runs as uid 10001, so both files must be world-readable
#   (chmod 644) or owned by that uid.
#   Self-signed certificate for local use:
#     mkdir -p certs && openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#       -subj "/CN=localhost" -keyout certs/tls.key -out certs/tls.crt \
#     && chmod 644 certs/tls.key certs/tls.crt
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Backend – Flask API + Frontend (SQLite embedded)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: src/backend/Containerfile
    container_name: pontifex-backend
    restart: unless-stopped
    ports:
      - "${PORT:-7337}:${PORT:-7337}"
    environment:
      # One-time bootstrap key – unique per container deployment
      INITIAL_API_KEY: ${INITIAL_API_KEY}
      # Inter-container identity key sent on every cross-service request
      CONTAINER_API_KEY: ${CONTAINER_API_KEY}
      # HMAC secret for signing JWT access tokens
      JWT_SECRET: ${JWT_SECRET}
      # TLS certificate paths INSIDE the container (read from .env at runtime,
      # defaults match the ENV defaults in the Containerfile)
      TLS_CERT_PATH: ${TLS_CERT_PATH:-/run/secrets/tls.crt}
      TLS_KEY_PATH: ${TLS_KEY_PATH:-/run/secrets/tls.key}
      # Server port
      PORT: ${PORT:-7337}
      # SQLite database file path (inside the container)
      DB_PATH: ${DB_PATH:-/app/data/pontifex.db}
    volumes:
      # Host directory with tls.crt / tls.key -> /run/secrets in the container
      - ${CERTS_DIR:-./certs}:/run/secrets:ro
      - sqlite_data:/app/data
    networks:
      - pontifex-net
    healthcheck:
      test: >
        python -c "import urllib.request, ssl;
        urllib.request.urlopen('https://127.0.0.1:${PORT:-7337}/api/health',
        timeout=2, context=ssl._create_unverified_context())"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

# =============================================================================
# Named volumes
# =============================================================================
volumes:
  # SQLite database file – persists across container restarts
  sqlite_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  pontifex-net:
    driver: bridge
