# Pontifex - Compose (podman compose / docker compose)
#
#   ./scripts/init-env.sh        # creates .env with random secrets
#   podman compose up -d         # pulls the images published by the CI pipeline
#
# Frontend: https://127.0.0.1:8443 (self-signed certificate)
#
# Local sources instead of the published images (they get the tag "local"):
#   podman build -t ghcr.io/claaswenk/pontifex-backend:local  -f src/backend/Containerfile .
#   podman build -t ghcr.io/claaswenk/pontifex-frontend:local -f src/frontend/Containerfile .
#   podman build -t ghcr.io/claaswenk/pontifex-database:local -f src/database/Containerfile .
#   PONTIFEX_TAG=local podman compose up -d      (PowerShell: $env:PONTIFEX_TAG='local')
#
# Services:
#   frontend    Flask UI. Talks to the backend only.
#   backend     REST API. Owns no data: it asks the database and answers 503 without it.
#   database    Owns the SQLite file. No published port, compose network only.
#   wake-relay  Sends the Wake-on-LAN packet. A UDP broadcast from a bridge network never
#               reaches the LAN, so this one container runs in the host network. It listens
#               on a Unix socket only and takes nothing but a MAC address.
#
# TLS is automatic: every container makes its own self-signed certificate on first start
# and keeps it in a named volume. Trust between containers rests on the pair secrets
# (BACKEND_FRONTEND_SECRET, BACKEND_DATABASE_SECRET), not on the certificates; a missing
# or too short secret stops the container (src/shared/container_auth.py).
services:

  # Backend
  backend:
    image: ghcr.io/claaswenk/pontifex-backend:${PONTIFEX_TAG:-latest}
    container_name: pontifex-backend
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      # Local only by default. Use a specific host IP to expose it, never 0.0.0.0.
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${PORT:-7337}:${PORT:-7337}"
    environment:
      # One-time bootstrap key for creating the first admin
      INITIAL_API_KEY: ${INITIAL_API_KEY}
      # HMAC secret for signing JWT access tokens
      JWT_SECRET: ${JWT_SECRET}
      # Container-to-container secrets, one per pair. Never sent over the wire.
      BACKEND_FRONTEND_SECRET: ${BACKEND_FRONTEND_SECRET}
      BACKEND_DATABASE_SECRET: ${BACKEND_DATABASE_SECRET}
      # Where the backend reaches the frontend
      FRONTEND_URL: ${FRONTEND_URL:-https://frontend:8443}
      DATABASE_URL: ${DATABASE_URL:-https://database:13110}
      PEER_CHECK_INTERVAL_SECONDS: ${PEER_CHECK_INTERVAL_SECONDS:-30}
      PORT: ${PORT:-7337}
    volumes:
      - tls_certs:/app/certs
      - wake_socket:/run/pontifex
    depends_on:
      - database
    networks:
      - pontifex-net
    healthcheck:
      test: >
        python -c "import urllib.request, ssl;
        urllib.request.urlopen('https://127.0.0.1:${PORT:-7337}/api/health',
        timeout=2, context=ssl._create_unverified_context())"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Database
  database:
    image: ghcr.io/claaswenk/pontifex-database:${PONTIFEX_TAG:-latest}
    container_name: pontifex-database
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # No published port: only the backend reaches it, over the compose network.
    environment:
      # Only the secret shared with the backend; no JWT secret, no frontend secret
      BACKEND_DATABASE_SECRET: ${BACKEND_DATABASE_SECRET}
      PORT: ${DATABASE_PORT:-13110}
      # SQLite database file path (inside the container)
      DB_PATH: ${DB_PATH:-/app/data/pontifex.db}
      # Peer check interval
      PEER_CHECK_INTERVAL_SECONDS: ${PEER_CHECK_INTERVAL_SECONDS:-30}
    volumes:
      - database_tls_certs:/app/certs
      - sqlite_data:/app/data
    networks:
      - pontifex-net

  # Wake relay: the only container in the host network
  wake-relay:
    image: ghcr.io/claaswenk/pontifex-backend:${PONTIFEX_TAG:-latest}
    container_name: pontifex-wake-relay
    restart: unless-stopped
    # No TLS and no entrypoint script needed: run the relay directly.
    entrypoint: ["python", "-c", "from app.services import run_wake_relay; run_wake_relay()"]
    network_mode: host
    user: "10001:10001"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # Where the packet goes. Use the broadcast address of your LAN, e.g.
      # 192.168.1.255 (see .env.example). Not changeable through the API.
      WOL_BROADCAST: ${WOL_BROADCAST:-255.255.255.255}
      WOL_PORT: ${WOL_PORT:-9}
    volumes:
      - wake_socket:/run/pontifex
    healthcheck:
      test: >
        python -c "import os, stat, sys;
        sys.exit(0 if stat.S_ISSOCK(os.stat('/run/pontifex/wake.sock').st_mode) else 1)"
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

  # Frontend: published on FRONTEND_BIND_ADDRESS:FRONTEND_PORT
  frontend:
    image: ghcr.io/claaswenk/pontifex-frontend:${PONTIFEX_TAG:-latest}
    container_name: pontifex-frontend
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8443}:8443"
    environment:
      # Frontend bind address and port
      FRONTEND_BIND_ADDRESS: ${FRONTEND_BIND_ADDRESS:-127.0.0.1}
      FRONTEND_PORT: ${FRONTEND_PORT:-8443}
      # Only the secret shared with the backend; no JWT secret, no database secret
      BACKEND_FRONTEND_SECRET: ${BACKEND_FRONTEND_SECRET}
      # Where the frontend reaches the backend (set it too if PORT is changed)
      BACKEND_URL: ${BACKEND_URL:-https://backend:7337}
      # Peer check interval
      PEER_CHECK_INTERVAL_SECONDS: ${PEER_CHECK_INTERVAL_SECONDS:-30}
      # Extra names/IPs in the self-signed certificate (used on first start only)
      TLS_EXTRA_SANS: ${TLS_EXTRA_SANS:-}
    volumes:
      - frontend_tls_certs:/app/certs
    networks:
      - pontifex-net
    healthcheck:
      test: >
        python -c "import urllib.request, ssl;
        urllib.request.urlopen('https://127.0.0.1:8443/health',
        timeout=2, context=ssl._create_unverified_context())"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

# Named volumes
volumes:
  # SQLite database file, owned by the database container only
  sqlite_data:
    driver: local

  # Persistent TLS certificate and private key of the database
  database_tls_certs:
    driver: local

  # Persistent TLS certificate and private key of the backend
  tls_certs:
    driver: local

  # Persistent TLS certificate and private key of the frontend
  frontend_tls_certs:
    driver: local

  # Unix socket between backend and wake relay. Nothing but the socket is in it.
  wake_socket:
    driver: local

# Networks
networks:
  pontifex-net:
    driver: bridge
