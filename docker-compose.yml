# =============================================================================
# Pontifex - Docker Compose
# =============================================================================
# Usage:
#   1. Generate secrets and certificates:
#      ./secrets/generate_secrets.sh
#   2. Start containers:
#      podman compose up --build
#
# Architecture:
#   backend   - Flask REST API (/api/*) + serves frontend SPA from src/frontend/
#   database  - Flask API for database operations (container-auth only)
#   frontend  - Flask UI (HTTPS, serves SPA)
#
# Container-to-Container Authentication:
#   Each pair of containers shares a secret (BACKEND_FRONTEND_SECRET,
#   BACKEND_DATABASE_SECRET) that is bound to their TLS certificates.
#   These secrets are provided via env_file and never committed to Git.
#
# TLS Certificates:
#   Self-signed certificates are generated by ./secrets/generate_secrets.sh
#   and mounted into containers at /run/secrets/ (database, backend)
#   or /app/certs/ (frontend).
#
# Data Persistence:
#   SQLite databases are stored in named volumes.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Backend - Flask API + Frontend (SQLite embedded)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: src/backend/Containerfile
    container_name: pontifex-backend
    restart: unless-stopped
    ports:
      - "${PORT:-7337}:${PORT:-7337}"
    env_file:
      - secrets/backend.env
    environment:
      # Server port (override via backend.env or .env)
      PORT: ${PORT:-7337}
      # SQLite database file path (inside the container)
      DB_PATH: ${DB_PATH:-/app/data/pontifex.db}
      # URL where the frontend can be reached (for peer monitoring)
      FRONTEND_URL: ${FRONTEND_URL:-https://frontend:8443}
      # Database container URL
      DATABASE_URL: ${DATABASE_URL:-https://database:13110}
      # Peer check interval
      PEER_CHECK_INTERVAL_SECONDS: ${PEER_CHECK_INTERVAL_SECONDS:-30}
    volumes:
      # TLS certificates (mounted from secrets/certs/backend)
      - ./secrets/certs/backend:/run/secrets:ro
      # SQLite database persistence
      - sqlite_data:/app/data
    networks:
      - pontifex-net
    healthcheck:
      test: >
        python -c "import urllib.request, ssl;
        urllib.request.urlopen('https://127.0.0.1:${PORT:-7337}/api/health',
        timeout=2, context=ssl._create_unverified_context())"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Database - Flask API for database operations
  # ---------------------------------------------------------------------------
  database:
    build:
      context: .
      dockerfile: src/database/Containerfile
    container_name: pontifex-database
    restart: unless-stopped
    ports:
      - "${DATABASE_PORT:-13110}:${DATABASE_PORT:-13110}"
    env_file:
      - secrets/database.env
    environment:
      # Server port (override via database.env or .env)
      PORT: ${DATABASE_PORT:-13110}
      # SQLite database file path (inside the container)
      DB_PATH: ${DB_PATH:-/app/data/pontifex.db}
      # Peer check interval
      PEER_CHECK_INTERVAL_SECONDS: ${PEER_CHECK_INTERVAL_SECONDS:-30}
    volumes:
      # TLS certificates (mounted from secrets/certs/database)
      - ./secrets/certs/database:/run/secrets:ro
      # SQLite database persistence
      - sqlite_data:/app/data
    networks:
      - pontifex-net

  # ---------------------------------------------------------------------------
  # Frontend - Flask UI (HTTPS, published on FRONTEND_BIND_ADDRESS:FRONTEND_PORT)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: src/frontend/Containerfile
    container_name: pontifex-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8443}:8443"
    env_file:
      - secrets/frontend.env
    environment:
      # Frontend bind address and port
      FRONTEND_BIND_ADDRESS: ${FRONTEND_BIND_ADDRESS:-127.0.0.1}
      FRONTEND_PORT: ${FRONTEND_PORT:-8443}
      # URL where the backend can be reached (for peer monitoring)
      BACKEND_URL: ${BACKEND_URL:-https://backend:7337}
      # Peer check interval
      PEER_CHECK_INTERVAL_SECONDS: ${PEER_CHECK_INTERVAL_SECONDS:-30}
      # Extra SANs for TLS certificate
      TLS_EXTRA_SANS: ${TLS_EXTRA_SANS:-}
    volumes:
      # TLS certificates (generated on first startup by Containerfile)
      - frontend_tls_certs:/app/certs
    networks:
      - pontifex-net
    healthcheck:
      test: >
        python -c "import urllib.request, ssl;
        urllib.request.urlopen('https://127.0.0.1:8443/health',
        timeout=2, context=ssl._create_unverified_context())"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

# =============================================================================
# Named volumes
# =============================================================================
volumes:
  # SQLite database volume (shared between backend and database for simplicity)
  sqlite_data:
    driver: local

  # TLS certificates for frontend (auto-generated on first startup)
  frontend_tls_certs:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  pontifex-net:
    driver: bridge
