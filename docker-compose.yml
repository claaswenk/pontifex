# =============================================================================
# Pontifex – Docker Compose
# =============================================================================
# Usage:
#   cp .env.example .env          # fill in all secrets
#   docker compose up --build
#
# One service:
#   backend   – Flask serves both the REST API (/api/*) and the frontend SPA
#               from src/frontend/.  SQLite DB is embedded in the same container.
#
# Frontend build:
#   Place your compiled frontend assets in src/frontend/ before building the
#   container image (e.g. output of `npm run build`). Flask serves them as
#   static files; any unknown route falls back to index.html for SPA routing.
#
# Database:
#   SQLite runs inside the backend container. The database file is stored in
#   the named volume sqlite_data, mounted at /app/data/pontifex.db.
#   Set DB_PATH in your .env to override the default path.
#
# TLS (mandatory - automatically generated):
#   Each deployment generates its own self-signed TLS certificate and private
#   key on first container startup.
#   Certificates are stored persistently in the named volume tls_certs,
#   mounted at /app/certs.
#   No host-side certificate files are required.
#   The container runs as uid 10001.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Backend – Flask API + Frontend (SQLite embedded)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: src/backend/Containerfile
    container_name: pontifex-backend
    restart: unless-stopped
    ports:
      - "${PORT:-7337}:${PORT:-7337}"
    environment:
      # One-time bootstrap key – unique per container deployment
      INITIAL_API_KEY: ${INITIAL_API_KEY}
      # Inter-container identity key sent on every cross-service request
      CONTAINER_API_KEY: ${CONTAINER_API_KEY}
      # HMAC secret for signing JWT access tokens
      JWT_SECRET: ${JWT_SECRET}
      # Server port
      PORT: ${PORT:-7337}
      # SQLite database file path (inside the container)
      DB_PATH: ${DB_PATH:-/app/data/pontifex.db}
    volumes:
      # Individual TLS certificates per deployment
      - tls_certs:/app/certs
      # SQLite database
      - sqlite_data:/app/data
    networks:
      - pontifex-net
    healthcheck:
      test: >
        python -c "import urllib.request, ssl;
        urllib.request.urlopen('https://127.0.0.1:${PORT:-7337}/api/health',
        timeout=2, context=ssl._create_unverified_context())"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Frontend – Flask UI (HTTPS, published on FRONTEND_BIND_ADDRESS:FRONTEND_PORT)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: src/frontend/Containerfile
    container_name: pontifex-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8443}:8443"
    environment:
      # Extra names/IPs in the self-signed certificate (used on first start only)
      TLS_EXTRA_SANS: ${TLS_EXTRA_SANS:-}
    volumes:
      - frontend_tls_certs:/app/certs
    networks:
      - pontifex-net
    healthcheck:
      test: >
        python -c "import urllib.request, ssl;
        urllib.request.urlopen('https://127.0.0.1:8443/health',
        timeout=2, context=ssl._create_unverified_context())"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

# =============================================================================
# Named volumes
# =============================================================================
volumes:
  # SQLite database volume
  sqlite_data:
    driver: local

  # Persistent TLS certificates and private key
  tls_certs:
    driver: local

  # Persistent TLS certificates and private key of the frontend
  frontend_tls_certs:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  pontifex-net:
    driver: bridge
