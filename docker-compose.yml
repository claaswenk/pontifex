# =============================================================================
# Pontifex – Compose (podman compose / docker compose, Linux)
# =============================================================================
# Quick start (pulls the images published by the CI pipeline):
#
#   ./scripts/init-env.sh        # creates .env with random secrets
#   podman compose up -d
#
# Frontend: https://127.0.0.1:8443  (self-signed certificate, see below)
# Backend:  https://127.0.0.1:7337/api/health
#
# Build the images from the local sources instead (development). The images get
# the tag "local", so nothing is pulled:
#   podman build -t ghcr.io/claaswenk/pontifex-backend:local  -f src/backend/Containerfile .
#   podman build -t ghcr.io/claaswenk/pontifex-frontend:local -f src/frontend/Containerfile .
#   PONTIFEX_TAG=local podman compose up -d        (Windows: $env:PONTIFEX_TAG='local')
#
# Pin an exact version instead of "latest" (set in .env):
#   PONTIFEX_TAG=v1.0.0   or   PONTIFEX_TAG=sha-<commit>
#
# Services:
#   backend   Flask REST API (/api/*). The database container is not part of
#             this stack yet; endpoints that need it answer with an error.
#   frontend  Flask UI. Talks to the backend only.
#
# TLS (mandatory, automatic):
#   Each container generates its own self-signed certificate on first start and
#   keeps it in a named volume. No host-side certificate files are needed.
#   Containers run as uid 10001.
#
# Container-to-container trust:
#   Not the certificate chain, but the pair secrets (BACKEND_FRONTEND_SECRET, ...)
#   bound to the presented certificate. See src/shared/container_auth.py.
#   Missing or too short secrets stop the container at startup.
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Backend – Flask API
  # ---------------------------------------------------------------------------
  backend:
    image: ghcr.io/claaswenk/pontifex-backend:${PONTIFEX_TAG:-latest}
    container_name: pontifex-backend
    restart: unless-stopped
    ports:
      # Local only by default. Use a specific host IP to expose it, never 0.0.0.0.
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${PORT:-7337}:${PORT:-7337}"
    environment:
      # One-time bootstrap key for creating the first admin
      INITIAL_API_KEY: ${INITIAL_API_KEY}
      # HMAC secret for signing JWT access tokens
      JWT_SECRET: ${JWT_SECRET}
      # Container-to-container secrets, one per pair. Never sent over the wire.
      BACKEND_FRONTEND_SECRET: ${BACKEND_FRONTEND_SECRET}
      BACKEND_DATABASE_SECRET: ${BACKEND_DATABASE_SECRET}
      # Where the backend reaches the frontend
      FRONTEND_URL: ${FRONTEND_URL:-https://frontend:8443}
      PEER_CHECK_INTERVAL_SECONDS: ${PEER_CHECK_INTERVAL_SECONDS:-30}
      PORT: ${PORT:-7337}
    volumes:
      - tls_certs:/app/certs
    networks:
      - pontifex-net
    healthcheck:
      test: >
        python -c "import urllib.request, ssl;
        urllib.request.urlopen('https://127.0.0.1:${PORT:-7337}/api/health',
        timeout=2, context=ssl._create_unverified_context())"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Frontend – Flask UI (HTTPS, published on FRONTEND_BIND_ADDRESS:FRONTEND_PORT)
  # ---------------------------------------------------------------------------
  frontend:
    image: ghcr.io/claaswenk/pontifex-frontend:${PONTIFEX_TAG:-latest}
    container_name: pontifex-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-8443}:8443"
    environment:
      # Only the secret shared with the backend; no JWT secret, no database secret
      BACKEND_FRONTEND_SECRET: ${BACKEND_FRONTEND_SECRET}
      # Where the frontend reaches the backend (set it too if PORT is changed)
      BACKEND_URL: ${BACKEND_URL:-https://backend:7337}
      PEER_CHECK_INTERVAL_SECONDS: ${PEER_CHECK_INTERVAL_SECONDS:-30}
      # Extra names/IPs in the self-signed certificate (used on first start only)
      TLS_EXTRA_SANS: ${TLS_EXTRA_SANS:-}
    volumes:
      - frontend_tls_certs:/app/certs
    networks:
      - pontifex-net
    healthcheck:
      test: >
        python -c "import urllib.request, ssl;
        urllib.request.urlopen('https://127.0.0.1:8443/health',
        timeout=2, context=ssl._create_unverified_context())"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

# =============================================================================
# Named volumes
# =============================================================================
volumes:
  # Persistent TLS certificate and private key of the backend
  tls_certs:
    driver: local

  # Persistent TLS certificate and private key of the frontend
  frontend_tls_certs:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  pontifex-net:
    driver: bridge
