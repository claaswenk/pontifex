{% extends "base.html" %}
{% block title %}Choose your password{% endblock %}

{% block content %}
<div class="auth">
  <div class="auth-card auth-card--scene">
    <div class="scene" aria-hidden="true">
      <span class="scene-moon"></span>
      <img class="scene-owl" src="{{ url_for('static', filename='img/logo-320.png') }}" width="128" height="128" alt="">
    </div>
    <div class="auth-body">
      <h1>Choose your password</h1>
      <p class="lead">The administrator set your current password. Replace it with one only you know.</p>
      <form method="post" action="{{ url_for('change_password') }}" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="current_password">Current password</label>
        <input id="current_password" name="current_password" type="password" autocomplete="current-password" maxlength="1024"{% if form.invalid('current_password') %} aria-invalid="true"{% endif %} required autofocus>
        <label for="new_password">New password</label>
        <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" maxlength="1024"{% if form.invalid('new_password') %} aria-invalid="true"{% endif %} required>
        <label for="new_password_confirm">Repeat new password</label>
        <input id="new_password_confirm" name="new_password_confirm" type="password" autocomplete="new-password" minlength="12" maxlength="1024"{% if form.invalid('new_password_confirm') %} aria-invalid="true"{% endif %} required>
        <button type="submit" class="button">Save password</button>
      </form>
      <p class="hint">At least 12 characters, different from the current one.</p>
    </div>
  </div>
</div>
{% endblock %}
