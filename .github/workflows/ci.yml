name: CI Pipeline

on:
  push:
    branches: ["main", "dev", "test/dast-**"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "dev"]
  workflow_dispatch:
    inputs:
      run_dast:
        description: "Run the DAST job (OWASP ZAP baseline scan)"
        type: boolean
        default: true

# Least privilege by default. Individual jobs raise permissions only where needed
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# All third-party actions are pinned to a full commit SHA
jobs:
  # ---------------------------------------------------------------------------
  # Branch protection: only dev -> main pull requests are allowed
  # ---------------------------------------------------------------------------
  dev-to-main-policy:
    name: Enforce dev-to-main policy
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify source branch
        env:
          SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${SOURCE_BRANCH}" != "dev" ]; then
            echo "::error::Only pull requests from dev into main are allowed."
            exit 1
          fi

          if [ "${SOURCE_REPOSITORY}" != "${TARGET_REPOSITORY}" ]; then
            echo "::error::Pull requests must originate from the same repository."
            exit 1
          fi

          echo "Valid dev -> main pull request."

  # ---------------------------------------------------------------------------
  # Code Security / Supply Chain: secrets, container lint
  # ---------------------------------------------------------------------------
  secrets-and-lint:
    name: Secret scan and Containerfile lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Gitleaks (secret scanning, full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Hadolint (Containerfile lint, backend)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: src/backend/Containerfile
          failure-threshold: warning

      - name: Hadolint (Containerfile lint, frontend)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: src/frontend/Containerfile
          failure-threshold: warning

      # Starts linting as soon as the database Containerfile exists
      - name: Hadolint (Containerfile lint, database)
        if: hashFiles('src/database/Containerfile') != ''
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: src/database/Containerfile
          failure-threshold: warning

  # ---------------------------------------------------------------------------
  # Code Security: SAST. Findings >= MEDIUM fail the job.
  # ---------------------------------------------------------------------------
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install Bandit (pinned)
        run: python -m pip install --no-cache-dir bandit==1.9.4

      - name: Run Bandit (gate - fails on MEDIUM or higher)
        run: |
          bandit -r src -c .bandit.yaml -ll --format json --output bandit-report.json --exit-zero
          bandit -r src -c .bandit.yaml -ll

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sast-report
          path: bandit-report.json

  # ---------------------------------------------------------------------------
  # Supply Chain: known vulnerabilities in dependencies
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: Dependency vulnerability audit (pip-audit)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install pip-audit (pinned)
        run: python -m pip install --no-cache-dir pip-audit==2.10.1

      - name: Audit requirements.txt (gate - fails on any known vulnerability)
        run: |
          pip-audit -r requirements.txt --no-deps --disable-pip --format json --output pip-audit-report.json || true
          pip-audit -r requirements.txt --no-deps --disable-pip

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-report
          path: pip-audit-report.json
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Tests: every test case in tests/ must run and pass. A skipped test or an
  # empty run fails the job, so no case can silently drop out of the gate
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit and integration tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies (hash-pinned)
        run: python -m pip install --no-cache-dir --require-hashes -r requirements.txt

      - name: Run all test cases (fails on any failure, skip or empty run)
        run: |
          set -o pipefail
          python -W error::UserWarning -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
          summary="$(grep -E '^Ran [0-9]+ tests?' test-output.txt)"
          echo "${summary}"
          if [[ -z "${summary}" || "${summary}" == "Ran 0 tests"* ]]; then
            echo "::error::No test cases were run."
            exit 1
          fi
          if grep -qE '^(OK|FAILED) \(.*skipped' test-output.txt; then
            echo "::error::Skipped test cases are not allowed."
            exit 1
          fi

      - name: Upload test output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-output
          path: test-output.txt
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Build: image + SBOM + image scan + smoke test, once per service. The tested
  # image is the exact artifact that is later published. Not run for version
  # tags: they only promote the image that main already published.
  # ---------------------------------------------------------------------------
  build:
    name: Build, scan and smoke-test ${{ matrix.service }} image
    needs: [secrets-and-lint, sast, dependency-audit, unit-tests]
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            port: 7337
            health_path: /api/health
          - service: frontend
            port: 8443
            health_path: /health
          - service: database
            port: 13110
            health_path: /api/health
    env:
      IMAGE_NAME: pontifex-${{ matrix.service }}
      IMAGE_TAR: pontifex-${{ matrix.service }}-image.tar
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Built directly with podman (not `podman compose`): compose delegates to
      # the docker-compose provider, which has no --format flag. The docker
      # image format is required so that HEALTHCHECK is preserved.
      - name: Build container image
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          podman build --no-cache --format docker \
            -f "src/${SERVICE}/Containerfile" \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Show Python package versions in backend image
        if: matrix.service == 'backend'
        run: |
          podman run --rm --entrypoint python "${IMAGE_NAME}:${GITHUB_SHA}" -c '
          import importlib.metadata as md
          wanted = {"msgpack", "urllib3", "setuptools"}
          for dist in md.distributions():
              name = (dist.metadata.get("Name") or "").lower()
              if name in wanted:
                  print(f"{name}=={dist.version}")
          '
      - name: Export image as build artifact
        run: podman save --format docker-archive -o "${IMAGE_TAR}" "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          input: ${{ env.IMAGE_TAR }}
          format: cyclonedx
          output: sbom-${{ matrix.service }}.cdx.json

      - name: Scan image for vulnerabilities (gate - fails on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.76.2
          input: ${{ env.IMAGE_TAR }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy JSON report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-report-${{ matrix.service }}
          path: trivy-report.json
          if-no-files-found: warn

      - name: Verify container runs as non-root
        run: |
          uid="$(podman run --rm --entrypoint id "${IMAGE_NAME}:${GITHUB_SHA}" -u)"
          echo "container uid: ${uid}"
          test "${uid}" != "0"

      # Same path as a real deployment: no mounted certificate, the entrypoint
      # generates the self-signed one. Only the secrets are passed in.
      - name: Smoke test (start container over HTTPS, check health and HEALTHCHECK)
        env:
          PORT: ${{ matrix.port }}
          HEALTH_PATH: ${{ matrix.health_path }}
        run: |
          podman run -d --name app -p "127.0.0.1:${PORT}:${PORT}" \
            -e INITIAL_API_KEY="$(openssl rand -hex 32)" \
            -e BACKEND_FRONTEND_SECRET="$(openssl rand -hex 32)" \
            -e BACKEND_DATABASE_SECRET="$(openssl rand -hex 32)" \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            "${IMAGE_NAME}:${GITHUB_SHA}"
          for i in $(seq 1 30); do
            if curl -fsSk "https://127.0.0.1:${PORT}${HEALTH_PATH}" ; then echo; break; fi
            if [ "$i" = 30 ]; then podman logs app; exit 1; fi
            sleep 1
          done
          podman healthcheck run app
          podman stop app

      - name: Upload image artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-image-${{ matrix.service }}
          path: ${{ env.IMAGE_TAR }}
          retention-days: 7

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.cdx.json

  # ---------------------------------------------------------------------------
  # Dynamic testing: DAST (OWASP ZAP baseline). On demand or on test/dast-*
  # branches only, so intentionally insecure code never reaches main
  # ---------------------------------------------------------------------------
  dast:
    name: DAST (OWASP ZAP baseline)
    needs: build
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_dast) ||
      startsWith(github.ref, 'refs/heads/test/dast-')
    runs-on: ubuntu-24.04
    # The API is the scan target, so only the backend image is needed
    env:
      IMAGE_NAME: pontifex-backend
      IMAGE_TAR: pontifex-backend-image.tar
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-image-backend

      - name: Start application under test
        run: |
          podman load -i "${IMAGE_TAR}"
          podman run -d --name app -p 127.0.0.1:7337:7337 \
            -e INITIAL_API_KEY="$(openssl rand -hex 32)" \
            -e BACKEND_FRONTEND_SECRET="$(openssl rand -hex 32)" \
            -e BACKEND_DATABASE_SECRET="$(openssl rand -hex 32)" \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            "${IMAGE_NAME}:${GITHUB_SHA}"
          for i in $(seq 1 30); do
            if curl -fsSk https://127.0.0.1:7337/api/health >/dev/null; then break; fi
            if [ "$i" = 30 ]; then podman logs app; exit 1; fi
            sleep 1
          done

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://127.0.0.1:7337/api/health
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:030d3df57735dacbb83464854758e674dd9ad01d79d12a129a8e58b1fd384238 # stable
          fail_action: true
          allow_issue_writing: false
          artifact_name: dast-report

  # ---------------------------------------------------------------------------
  # Publish: only from main, only after every gate passed, and only the images
  # that were built and tested above. Tags: sha-<commit> and latest.
  # Result: ghcr.io/<owner>/pontifex-backend, -frontend and -database
  # ---------------------------------------------------------------------------
  publish:
    name: Publish ${{ matrix.service }} image to GHCR
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, database]
    env:
      IMAGE_NAME: pontifex-${{ matrix.service }}
      IMAGE_TAR: pontifex-${{ matrix.service }}-image.tar
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-image-${{ matrix.service }}

      - name: Load tested image
        run: podman load -i "${IMAGE_TAR}"

      - name: Log in to GHCR (short-lived GITHUB_TOKEN, no stored secrets)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "${REGISTRY_TOKEN}" | podman login ghcr.io -u "${REGISTRY_USER}" --password-stdin

      # "latest" is what docker-compose.yml pulls by default; it only moves on main
      - name: Tag and push
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}"
          for t in "sha-${GITHUB_SHA}" latest; do
            podman tag "${IMAGE_NAME}:${GITHUB_SHA}" "${repo}:${t}"
            podman push --format v2s2 --digestfile digest.txt "${repo}:${t}"
          done
          echo "Published ${repo}@$(cat digest.txt)" | tee -a "${GITHUB_STEP_SUMMARY}"

  # ---------------------------------------------------------------------------
  # Promote: a version tag builds nothing. It adds the version tag to the image
  # that main already published as sha-<commit>, so the release carries the
  # exact digest that passed the gates. A wrong tag changes nothing.
  # ---------------------------------------------------------------------------
  promote:
    name: Promote ${{ matrix.service }} image to the version tag
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend, database]
    steps:
      - name: Checkout code (for the main-ancestry check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify version tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${TAG}' is not a version like v1.2.3 or v1.2.3-rc.1."
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag '${TAG}' points to a commit that is not on main. Release from main only."
            exit 1
          fi
          echo "Tag ${TAG} is valid and on main."

      - name: Log in to GHCR (short-lived GITHUB_TOKEN, no stored secrets)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "${REGISTRY_TOKEN}" | skopeo login ghcr.io -u "${REGISTRY_USER}" --password-stdin

      # Version tags never move: an existing one is accepted only if it already
      # points to this digest, which makes a re-run of a failed job safe.
      - name: Add the version tag to the published image
        env:
          TAG: ${{ github.ref_name }}
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}"
          if ! source="$(skopeo inspect --format '{{.Digest}}' "docker://${repo}:sha-${GITHUB_SHA}")"; then
            echo "::error::No image ${repo}:sha-${GITHUB_SHA}. Tag only after the CI run on main is green."
            exit 1
          fi
          if existing="$(skopeo inspect --format '{{.Digest}}' "docker://${repo}:${TAG}" 2>/dev/null)" \
              && [ "${existing}" != "${source}" ]; then
            echo "::error::${repo}:${TAG} already exists with another digest. Version tags never move."
            exit 1
          fi
          skopeo copy --all --preserve-digests "docker://${repo}@${source}" "docker://${repo}:${TAG}"
          echo "Promoted ${repo}:${TAG} -> ${source}" | tee -a "${GITHUB_STEP_SUMMARY}"
          echo "${repo}@${source}" > "digest-${{ matrix.service }}.txt"

      - name: Keep digest for the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.service }}
          path: digest-${{ matrix.service }}.txt
          retention-days: 1

  # ---------------------------------------------------------------------------
  # GitHub Release: only for version tags, only after all images are
  # promoted. Write access to repository contents is limited to this job.
  # The notes list the PRs since the previous release plus the image digests.
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    needs: promote
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "## Images"
            echo
            echo "Pin these digests for a reproducible deployment:"
            echo
            echo '```'
            cat digest-backend.txt digest-frontend.txt digest-database.txt
            echo '```'
            echo
            echo "Deploy: set \`PONTIFEX_TAG=${TAG}\` in \`.env\`, then \`podman compose pull && podman compose up -d\`."
          } > notes.md

          # A release created by hand in the web UI must not fail the pipeline
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::warning::Release ${TAG} already exists, leaving it unchanged. Push the tag only; the pipeline creates the release."
            exit 0
          fi

          prerelease=()
          if [[ "${TAG}" == *-* ]]; then prerelease=(--prerelease); fi

          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${TAG}" \
            --generate-notes \
            --notes-file notes.md \
            "${prerelease[@]}"
