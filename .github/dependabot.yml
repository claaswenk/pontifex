version: 2
updates:
  - package-ecosystem: "pip"
    directories: "/*"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directories: "/*"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directories: "/*"
    target-branch: "dev"
    schedule:
      interval: "weekly"
