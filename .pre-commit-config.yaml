# .pre-commit-config.yaml
# Revisions are pinned to full commit SHAs.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/gitleaks/gitleaks
    rev: 6eaad039603a4de39fddd1cf5f727391efe9974e # v8.30.0
    hooks:
      - id: gitleaks

  # hadolint-py ships the hadolint binary as a Python package, so no Docker
  # daemon is needed (the official hadolint-docker hook requires one).
  # >= v2.15.1 downloads a native arm64 binary on Apple Silicon; older
  # versions fetch an x86_64 binary that segfaults (exit code -11).
  - repo: https://github.com/AleksaC/hadolint-py
    rev: 6e7504451511eaeb62a3e7f14d63b0296cbf86eb # v2.15.1
    hooks:
      - id: hadolint
        name: Lint Containerfile
        args: ["--failure-threshold", "warning"]
        files: ^src/(backend|frontend|database)/Containerfile$
        types: [file]

  - repo: https://github.com/PyCQA/bandit
    rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # 1.9.4
    hooks:
      - id: bandit
        name: SAST (bandit)
        args: ["-c", ".bandit.yaml", "-ll"]
        files: ^src/
